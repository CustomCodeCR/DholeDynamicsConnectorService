name: Dynamics read-only connectivity diagnostics

on:
  push:
    branches: [develop]
    paths: [.github/workflows/dynamics-connectivity-diagnostics.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-cors:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public POST CORS without credentials
        shell: bash
        run: |
          set -euo pipefail
          echo 'Public OPTIONS:'
          curl -sS --max-time 18 -X OPTIONS -o /dev/null -D - \
            -H 'Origin: https://sistema.logisticacastrofallas.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type' \
            https://api.logisticacastrofallas.com/api/dynamics-admin/connections/principal/test \
            | grep -Ei '^(HTTP/|access-control-allow-|vary:|content-type:|server:)' || true
          echo 'Public actual POST without authentication:'
          curl -sS --max-time 18 -X POST -o /dev/null -D - \
            -H 'Origin: https://sistema.logisticacastrofallas.com' \
            -H 'Content-Type: application/json' \
            https://api.logisticacastrofallas.com/api/dynamics-admin/connections/principal/test \
            | grep -Ei '^(HTTP/|access-control-allow-|vary:|content-type:|server:)' || true
          echo 'Public health GET (no user credentials):'
          curl -sS --max-time 18 -o /dev/null -D - \
            -H 'Origin: https://sistema.logisticacastrofallas.com' \
            https://api.logisticacastrofallas.com/api/health/gateway \
            | grep -Ei '^(HTTP/|access-control-allow-|vary:|content-type:|server:|www-authenticate:|via:|cf-ray:)' || true
          echo 'Public Dynamics list GET (no user credentials):'
          curl -sS --max-time 18 -o /dev/null -D - \
            -H 'Origin: https://sistema.logisticacastrofallas.com' \
            https://api.logisticacastrofallas.com/api/dynamics-admin/connections \
            | grep -Ei '^(HTTP/|access-control-allow-|vary:|content-type:|server:|www-authenticate:|via:|cf-ray:)' || true
          echo 'Successful response must be unauthorized, without a token.'

  diagnostic:
    runs-on: [self-hosted, linux, x64, dhole]
    timeout-minutes: 10
    steps:
      - name: Diagnose 502 path without any write credentials or quote mutations
        shell: bash
        run: |
          set -euo pipefail
          echo '---- Runtime container health (non-secret status only) ----'
          for name in dhole-dynamics-production-dynamics-api-1 dhole-api-gateway-1; do
            if docker inspect "$name" >/dev/null 2>&1; then
              docker inspect -f '{{.Name}} state={{.State.Status}} restarts={{.RestartCount}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$name"
            else
              echo "$name: missing"
            fi
          done
          echo '---- POST authentication preflight: no credentials, no body, no writes ----'
          urls=(
            'http://dynamics-api:8080/api/dynamics-admin/connections/principal/metadata/entities/quote/alternate-keys'
            'http://api-gateway:8080/api/dynamics-admin/connections/principal/metadata/entities/quote/alternate-keys'
            'https://api.logisticacastrofallas.com/api/dynamics-admin/connections/principal/metadata/entities/quote/alternate-keys'
          )
          for i in "${!urls[@]}"; do
            status="$(docker run --rm --network dhole curlimages/curl:8.15.0 \
              --max-time 12 -sS -o /dev/null -w '%{http_code}|%{time_total}|%{content_type}' \
              -X POST -H 'Content-Type: application/json' \
              -H 'Origin: https://sistema.logisticacastrofallas.com' \
              --data '{"field":"new_idtraasignado","confirm":true}' \
              "${urls[$i]}")" || status='unreachable'
            echo "path=$i result=$status"
          done
          echo '---- Errors from existing API process (counts only; never raw logs) ----'
          for name in dhole-dynamics-production-dynamics-api-1 dhole-api-gateway-1; do
            if ! docker inspect "$name" >/dev/null 2>&1; then continue; fi
            lines="$(docker logs --since 2026-10-27T04:40:00Z --until 2026-10-27T04:46:00Z "$name" 2>&1 | grep -Eic 'error|exception|unhandled|disconnected|shutdown|failed' || true)"
            echo "$name diagnostic_error_line_count=$lines"
          done
      - name: Locate Cloudflare 502 at origin proxies from access counts only
        shell: bash
        run: |
          set -euo pipefail
          echo '---- Proxy containers at origin (names/health only) ----'
          docker ps --format '{{.Names}}' | grep -Ei '(traefik|pangolin|cloudflared|nginx|gerbil|gateway)' || true
          echo '---- Edge request reachability during incident 04:42 UTC ----'
          for name in traefik dhole-api-gateway-1; do
            if ! docker inspect "$name" >/dev/null 2>&1; then
              echo "$name is absent"; continue
            fi
            access="$(docker logs --since 2026-10-27T04:42:30Z --until 2026-10-27T04:43:10Z "$name" 2>&1 | grep -Ec 'POST /api/dynamics-admin/connections/principal/metadata/entities/quote/alternate-keys' || true)"
            total="$(docker logs --since 2026-10-27T04:42:30Z --until 2026-10-27T04:43:10Z "$name" 2>&1 | grep -Ec 'HTTP/|Gateway forwarding' || true)"
            echo "$name incident_exact_request_count=$access other_access_count=$total"
          done
          echo '---- Sanitized Traefik access statuses at incident UTC ----'
          if docker inspect traefik >/dev/null 2>&1; then
            docker logs --since 2026-10-27T04:42:30Z --until 2026-10-27T04:43:10Z traefik 2>&1 |
              grep -F 'POST /api/dynamics-admin/connections/principal/metadata/entities/quote/alternate-keys' |
              awk -F '"' '{print "request=POST alternate-keys (redacted) status_and_duration=" substr($3,1,160)}' || true
          fi
          echo '---- Local reverse proxy direct request, no credentials or business action ----'
          for host in traefik api-gateway; do
            result="$(docker run --rm --network dhole curlimages/curl:8.15.0 \
              --max-time 10 -sS -o /dev/null -w '%{http_code}|%{time_total}|%{content_type}' \
              -H 'Host: api.logisticacastrofallas.com' \
              -X POST -H 'Content-Type: application/json' \
              --data '{"field":"new_idtraasignado","confirm":true}' \
              "http://$host:80/api/dynamics-admin/connections/principal/metadata/entities/quote/alternate-keys" 2>/dev/null)" || result='unreachable'
            echo "$host: $result"
          done
      - name: Check production Dynamics route observations and outbound DNS without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          file=/opt/dhole/.env
          test -r "$file"
          env_val() { sed -n "s/^$1=//p" "$file" | head -n 1 | tr -d '\r'; }
          network="$(env_val DHOLE_NETWORK)"
          [[ "$network" == dhole ]] || exit 1
          db="$(env_val DYNAMICS_DB)"
          [[ "$db" == dhole_dynamics_connector ]] || exit 1
          pg_host="$(env_val POSTGRES_HOST)"
          pg_port="$(env_val POSTGRES_PORT)"
          pg_user="$(env_val POSTGRES_USER)"
          password="$(env_val POSTGRES_PASSWORD)"
          [[ -n "$password" && "$pg_host" == postgres && "$pg_port" == 5432 ]] || exit 1
          echo "---- Sanitized connection-test observations (last 72h; no IDs/URLs/secrets) ----"
          docker run --rm --network "$network" -e PGPASSWORD="$password" postgres:16-alpine \
            psql -h "$pg_host" -p "$pg_port" -U "$pg_user" -d "$db" -v ON_ERROR_STOP=1 -Atqc \
            "SELECT to_char(observed_at AT TIME ZONE 'UTC','YYYY-MM-DD HH24:MI:SS'),method,status_code,elapsed_ms
            FROM dynamics.http_observations
            WHERE route_pattern LIKE '%/connections/%/test%'
            AND observed_at>now()-interval '72 hours'
            ORDER BY observed_at DESC LIMIT 16"
          echo "---- Actual alternate-key POST request outcomes, sanitized database observations ----"
          docker run --rm --network "$network" -e PGPASSWORD="$password" postgres:16-alpine \
            psql -h "$pg_host" -p "$pg_port" -U "$pg_user" -d "$db" -v ON_ERROR_STOP=1 -Atqc \
            "SELECT to_char(observed_at AT TIME ZONE 'UTC','YYYY-MM-DD HH24:MI:SS'),method,status_code,elapsed_ms
             FROM dynamics.http_observations
             WHERE route_pattern LIKE '%alternate-keys'
             AND observed_at BETWEEN '2026-10-27 04:40:00+00' AND '2026-10-27 04:46:00+00'
             ORDER BY observed_at ASC LIMIT 30"
          unset password
          echo "---- Gateway preflight status and allowed-method headers ----"
          docker run --rm --network "$network" curlimages/curl:8.15.0 -sS --max-time 10 \
            -o /dev/null -D - -X OPTIONS \
            -H "Origin: https://sistema.logisticacastrofallas.com" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type" \
            "http://api-gateway:8080/api/dynamics-admin/connections/principal/test" \
            | grep -Ei '^(HTTP/|access-control-allow-|vary:)' || true
          echo "---- Anonymous endpoint probe (expected 401, no secret values) ----"
          status="$(docker run --rm --network "$network" curlimages/curl:8.15.0 \
            -sS -o /dev/null -w '%{http_code}' --max-time 10 -X POST \
            -H 'Origin: https://sistema.logisticacastrofallas.com' \
            "http://api-gateway:8080/api/dynamics-admin/connections/principal/test")" || status="network_failure"
          echo "Anonymous POST status: $status"
          [[ "$status" == 401 ]] || exit 1
          echo "---- Compare CORS on ACTUAL unauthorized POST, at internal gateway and public HTTPS ----"
          for url in \
            "http://api-gateway:8080/api/dynamics-admin/connections/principal/test" \
            "https://api.logisticacastrofallas.com/api/dynamics-admin/connections/principal/test"; do
            echo "Checking ${url%%://*} transport"
            # Print ONLY status + CORS / content-type. Do not send authorization values.
            docker run --rm --network "$network" curlimages/curl:8.15.0 \
              -sS --max-time 15 -D - -o /dev/null -X POST \
              -H 'Origin: https://sistema.logisticacastrofallas.com' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              "$url" | grep -Ei '^(HTTP/|access-control-allow-|vary:|content-type:|server:)' || true
          done
          echo "---- Recent sanitized Dynamics test failure categories from running API logs ----"
          # Only the exact purpose-built diagnostic lines; never print raw exception or token details.
          for cid in $(docker ps --filter 'name=dynamics-api' --format '{{.ID}}' | head -n 3); do
            docker logs --since 2h "$cid" 2>&1 \
              | grep -E 'Dynamics connection test (rejected identity|failed at remote HTTP|has invalid persisted configuration|reached its bounded deadline)' \
              | sed -E 's/correlation=[^[:space:]]+/correlation=[redacted]/g' \
              | tail -n 12 || true
          done
          echo "---- Microsoft login endpoint egress (HTTPS only, no application token) ----"
          status="$(docker run --rm --network "$network" curlimages/curl:8.15.0 \
            -L -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            'https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration')" || status="network_failure"
          echo "Microsoft login public discovery HTTP status: $status"
          [[ "$status" == 200 ]] || exit 1

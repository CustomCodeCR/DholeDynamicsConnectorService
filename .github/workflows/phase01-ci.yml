name: connector-ci

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore DholeDynamicsConnectorService.slnx
      - run: dotnet build DholeDynamicsConnectorService.slnx -c Release --no-restore
      - run: dotnet test DholeDynamicsConnectorService.slnx -c Release --no-build --collect:"XPlat Code Coverage"
      - name: Vulnerable NuGet dependencies
        run: dotnet list src/Dhole.Dynamics.Api/Dhole.Dynamics.Api.csproj package --vulnerable --include-transitive
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.14.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan working tree for committed secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 dir /repo --no-banner --redact
  docker-smoke:
    runs-on: ubuntu-latest
    needs: [dotnet, frontend, secrets]
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral local-only credentials
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DYNAMICS_ENCRYPTION_KEY_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: docker compose up --build -d
      - name: Smoke API, DB, and frontend
        run: |
          set -euo pipefail
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8080/health/ready >/dev/null &&
               curl -fsS http://127.0.0.1:8081/ >/dev/null; then break; fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:8080/health/ready
          curl -fsS http://127.0.0.1:8081/ >/dev/null
      - name: Verify migration replay
        run: |
          docker compose run --rm migrate
          test "$(docker compose exec -T postgres psql -U connector_app -d dhole_dynamics_connector -Atc 'SELECT count(*) FROM dynamics.schema_migrations')" = "7"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Real PostgreSQL key rotation and migration tests
        run: |
          export PHASE2_TEST_DB_CONNECTION="Host=127.0.0.1;Port=55432;Database=dhole_dynamics_connector;Username=connector_app;Password=${POSTGRES_PASSWORD}"
          export PHASE2_SQL_DIR="$GITHUB_WORKSPACE/sql"
          dotnet test tests/Dhole.Dynamics.IntegrationTests/Dhole.Dynamics.IntegrationTests.csproj -c Release \
            --filter 'FullyQualifiedName~Phase02DatabaseTests|FullyQualifiedName~Phase03GrantTests|FullyQualifiedName~Phase04MetadataTests|FullyQualifiedName~Phase05ReadTests|FullyQualifiedName~Phase06WriteTests|FullyQualifiedName~Phase07TemplateTests' \
            --logger 'console;verbosity=normal'
      - name: Install backup and encryption tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age postgresql-client
      - name: Encrypted backup and sandbox restore drill
        env:
          PGHOST: 127.0.0.1
          PGPORT: '55432'
          PGUSER: connector_app
          PGPASSWORD: ""
        run: |
          set -euo pipefail
          export PGPASSWORD="$POSTGRES_PASSWORD"
          age-keygen -o "$RUNNER_TEMP/age-test-identity" >/dev/null 2>&1
          export AGE_RECIPIENT="$(age-keygen -y "$RUNNER_TEMP/age-test-identity")"
          export AGE_IDENTITY_FILE="$RUNNER_TEMP/age-test-identity"
          export BACKUP_FILE="$RUNNER_TEMP/connector-ci.dump.age"
          bash scripts/backup-encrypted.sh
          test -s "$BACKUP_FILE"
          ! grep -a -q 'phase2-fixture-encrypted-secret' "$BACKUP_FILE"
          psql -X -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE dhole_dynamics_connector_restore_ci'
          export RESTORE_DB_NAME=dhole_dynamics_connector_restore_ci
          export ALLOW_SANDBOX_RESTORE=YES
          bash scripts/restore-sandbox.sh
          test "$(psql -X -At -d "$RESTORE_DB_NAME" -c 'SELECT count(*) FROM dynamics.schema_migrations')" = "7"
          test "$(psql -X -At -d "$RESTORE_DB_NAME" -c 'SELECT count(*) FROM dynamics.secret_rotation_runs')" -ge 1
          if bash scripts/restore-sandbox.sh; then echo 'Unsafe repeated restore accepted'; exit 1; fi
          rm -f "$BACKUP_FILE" "$AGE_IDENTITY_FILE"
      - if: always()
        run: docker compose down -v

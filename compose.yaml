# Local developer environment only. Staging/production deployments belong to Phase 12.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dhole_dynamics
      POSTGRES_USER: connector_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - connector_db:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connector_app -d dhole_dynamics"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [connector_internal]
  api:
    build:
      context: .
      dockerfile: src/Dhole.Dynamics.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Dynamics: "Host=postgres;Port=5432;Database=dhole_dynamics;Username=connector_app;Password=${POSTGRES_PASSWORD:?}"
      Jwt__Issuer: "${JWT_ISSUER:-dhole-dynamics-local}"
      Jwt__Audience: "${JWT_AUDIENCE:-dhole-dynamics-consumer-local}"
      Jwt__SecretKey: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}"
      DYNAMICS_ENCRYPTION_KEY_BASE64: "${DYNAMICS_ENCRYPTION_KEY_BASE64:?Set DYNAMICS_ENCRYPTION_KEY_BASE64}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks: [connector_internal]
  admin:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on: [api]
    ports:
      - "127.0.0.1:8081:80"
    networks: [connector_internal]
networks:
  connector_internal:
    driver: bridge
volumes:
  connector_db:

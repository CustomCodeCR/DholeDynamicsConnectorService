# Local developer environment only. No production deploy or shared Dhole databases.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dhole_dynamics_connector
      POSTGRES_USER: connector_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - connector_db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connector_app -d dhole_dynamics_connector"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [connector_internal]
  migrate:
    build:
      context: .
      dockerfile: src/Dhole.Dynamics.Tools/Dockerfile
    environment:
      ConnectionStrings__Dynamics: "Host=postgres;Port=5432;Database=dhole_dynamics_connector;Username=connector_app;Password=${POSTGRES_PASSWORD:?}"
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [connector_internal]
  api:
    build:
      context: .
      dockerfile: src/Dhole.Dynamics.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      READ_CURSOR_KEY_BASE64: "${READ_CURSOR_KEY_BASE64:-}"
      Metadata__SchedulerEnabled: "${METADATA_SCHEDULER_ENABLED:-true}"
      ConnectionStrings__Dynamics: "Host=postgres;Port=5432;Database=dhole_dynamics_connector;Username=connector_app;Password=${POSTGRES_PASSWORD:?}"
      # Local auth remains disabled without a real external OIDC/OAuth provider.
      AdminOidc__Authority: "${ADMIN_OIDC_AUTHORITY:-}"
      Admin__PublicOrigin: "${ADMIN_PUBLIC_ORIGIN:-}"
      AdminOidc__ClientId: "${ADMIN_OIDC_CLIENT_ID:-}"
      AdminOidc__ClientSecret: "${ADMIN_OIDC_CLIENT_SECRET:-}"
      M2m__Authority: "${M2M_AUTHORITY:-}"
      M2m__Audience: "${M2M_AUDIENCE:-}"
      DYNAMICS_ENCRYPTION_KEY_BASE64: "${DYNAMICS_ENCRYPTION_KEY_BASE64:?Set DYNAMICS_ENCRYPTION_KEY_BASE64}"
      DYNAMICS_ENCRYPTION_KEYS_JSON: "${DYNAMICS_ENCRYPTION_KEYS_JSON:-}"
      DYNAMICS_ENCRYPTION_ACTIVE_KEY_VERSION: "${DYNAMICS_ENCRYPTION_ACTIVE_KEY_VERSION:-1}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    networks: [connector_internal]
  admin:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on: [api]
    ports:
      - "127.0.0.1:8081:80"
    networks: [connector_internal]
networks:
  connector_internal:
    driver: bridge
volumes:
  connector_db:

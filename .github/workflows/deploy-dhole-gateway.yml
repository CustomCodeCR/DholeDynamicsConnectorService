name: Deploy Dynamics Connector via existing Dhole PostgreSQL and Gateway

on:
  # Deploy tested connector changes from matching branches, retaining environment
  # protection and explicit production read-only database/write safeguards.
  push:
    branches: [develop, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/deploy-dhole-gateway.yml'
  workflow_dispatch:
    inputs:
      target:
        type: choice
        required: true
        options: [staging, production]
      change_ticket:
        type: string
        required: true
        description: "Approved change ticket (min 12 characters)"
      production_confirmation:
        type: string
        required: false
        description: "Production only: DEPLOY_READ_ONLY"

permissions:
  contents: read

concurrency:
  group: dynamics-existing-postgres-${{ github.event_name == 'push' && (github.ref_name == 'master' && 'production' || 'staging') || inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: ${{ github.event_name == 'push' && (github.ref_name == 'master' && 'production' || 'staging') || inputs.target }}
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Validate production read-only release and branch
        shell: bash
        env:
          TARGET: ${{ github.event_name == 'push' && (github.ref_name == 'master' && 'production' || 'staging') || inputs.target }}
          TICKET: ${{ inputs.change_ticket }}
          CONFIRM: ${{ github.event_name == 'push' && 'DEPLOY_READ_ONLY' || inputs.production_confirmation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$TICKET" =~ ^[a-zA-Z0-9][a-zA-Z0-9_./-]{11,119}$ ]] || exit 1
          else
            # Use immutable Git SHA for release audit; never invent a change approval.
            [[ "$GITHUB_EVENT_NAME" == push ]] || exit 1
            echo "Automated read-only release: $GITHUB_SHA"
          fi
          case "$TARGET" in
            staging) [[ "$GITHUB_REF" == refs/heads/develop ]] ;;
            production)
              [[ "$GITHUB_REF" == refs/heads/master ]] || exit 1
              [[ "$CONFIRM" == DEPLOY_READ_ONLY ]] ;;
            *) exit 1 ;;
          esac

      - name: Repair disposable runner checkout ownership before git checkout
        shell: bash
        run: |
          set -euo pipefail
          # Earlier SDK-in-Docker runs wrote root-owned bin/obj to this checkout.
          # The only mounted path is the dedicated workspace for this repository.
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" busybox:1.36 \
            sh -ec 'chown -R "$HOST_UID:$HOST_GID" /workspace'

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and test using the existing Docker SDK
        shell: bash
        run: |
          set -euo pipefail
          # The self-hosted runner cannot write /usr/share/dotnet. Use a disposable
          # SDK container; do not sudo/install the SDK on the host.
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e DOTNET_CLI_HOME=/tmp -e NUGET_PACKAGES=/tmp/nuget \
            -v "$PWD:/repo" -w /repo \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            bash -euc 'dotnet restore DholeDynamicsConnectorService.slnx &&
              dotnet build DholeDynamicsConnectorService.slnx -c Release --no-restore &&
              dotnet test DholeDynamicsConnectorService.slnx -c Release --no-build'

      - name: Load environment-matched DholeSystem topology
        shell: bash
        env:
          TARGET: ${{ github.event_name == 'push' && (github.ref_name == 'master' && 'production' || 'staging') || inputs.target }}
        run: |
          set -euo pipefail
          branch=develop
          if [[ "$TARGET" == production ]]; then branch=master; fi
          git clone --depth 1 --branch "$branch" https://github.com/CustomCodeCR/DholeSystem.git .dhole-system

      - name: Verify EXISTING Dhole Postgres, environment and read-only defaults
        shell: bash
        env:
          TARGET: ${{ github.event_name == 'push' && (github.ref_name == 'master' && 'production' || 'staging') || inputs.target }}
        run: |
          set -euo pipefail
          envfile=/opt/dhole/.env
          project=dhole-dynamics-production
          network=dhole
          tag=latest
          mainproject=dhole
          if [[ "$TARGET" == staging ]]; then
            envfile=/opt/dhole/.env.staging
            project=dhole-dynamics-staging
            network=dhole-staging
            tag=staging
            mainproject=dhole-staging
          fi
          test -r "$envfile"
          docker network inspect "$network" >/dev/null
          for key in ASPNETCORE_ENVIRONMENT DHOLE_NETWORK DYNAMICS_IMAGE_TAG DYNAMICS_DB \
            POSTGRES_HOST POSTGRES_PORT POSTGRES_USER POSTGRES_PASSWORD \
            JWT_ISSUER JWT_AUDIENCE JWT_SECRET DHOLE_API_PUBLIC_URL; do
            grep -q "^${key}=[^[:space:]]" "$envfile" || { echo "Missing existing env key: $key" >&2; exit 1; }
          done
          grep -qx "DYNAMICS_IMAGE_TAG=$tag" "$envfile"
          grep -qx "DHOLE_NETWORK=$network" "$envfile"
          grep -qx "DYNAMICS_DB=dhole_dynamics_connector" "$envfile"
          grep -qx "DYNAMICS_PRODUCTION_WRITES_APPROVED=NO" "$envfile"
          grep -qx "DYNAMICS_PRODUCTION_DELETES_APPROVED=NO" "$envfile"
          if [[ "$TARGET" == production ]]; then
            grep -qx "ASPNETCORE_ENVIRONMENT=Production" "$envfile"
          else
            grep -qx "ASPNETCORE_ENVIRONMENT=Staging" "$envfile"
          fi
          {
            echo "DYNAMICS_DEPLOY_ENV=$envfile"
            echo "DYNAMICS_DEPLOY_NETWORK=$network"
            echo "DYNAMICS_DEPLOY_PROJECT=$project"
            echo "DYNAMICS_DEPLOY_TAG=$tag"
            echo "DYNAMICS_DHOLE_PROJECT=$mainproject"
          } >> "$GITHUB_ENV"
          docker compose --env-file "$envfile" \
            -f .dhole-system/deploy/docker-compose.dynamics.yml -p "$project" config -q
          if [[ "$TARGET" == production ]]; then
            echo "Production read-only: writes/deletes remain disabled."
          fi

      - name: Build API and migrator for the selected environment
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -f src/Dhole.Dynamics.Api/Dockerfile \
            -t "dhole/dynamics-api:$DYNAMICS_DEPLOY_TAG" \
            -t "dhole/dynamics-api:${DYNAMICS_DEPLOY_TAG}-${GITHUB_SHA::12}" .
          docker build --pull -f src/Dhole.Dynamics.Tools/Dockerfile \
            -t "dhole/dynamics-tools:$DYNAMICS_DEPLOY_TAG" \
            -t "dhole/dynamics-tools:${DYNAMICS_DEPLOY_TAG}-${GITHUB_SHA::12}" .

      - name: Create ONLY connector database if missing on existing PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          get_env() {
            local key="$1"
            sed -n "s/^${key}=//p" "$DYNAMICS_DEPLOY_ENV" | head -n 1 | tr -d '\r'
          }
          db="$(get_env DYNAMICS_DB)"
          host="$(get_env POSTGRES_HOST)"
          port="$(get_env POSTGRES_PORT)"
          user="$(get_env POSTGRES_USER)"
          password="$(get_env POSTGRES_PASSWORD)"
          [[ "$db" == dhole_dynamics_connector ]] || exit 1
          [[ "$host" == postgres ]] || { echo "Unexpected host, refusing to create database" >&2; exit 1; }
          [[ "$port" == 5432 ]] || exit 1
          [[ -n "$password" && -n "$user" ]] || exit 1
          # Only network and database are environment scoped; NEVER touch other DBs.
          # -i is essential: without it Docker closes stdin and psql -f -
          # exits with success without executing any SQL.
          docker run --rm -i --network "$DYNAMICS_DEPLOY_NETWORK" \
            -e PGPASSWORD="$password" postgres:16-alpine \
            psql -h "$host" -p "$port" -U "$user" -d postgres \
                 -v ON_ERROR_STOP=1 -v "dbname=$db" -f - <<'SQL'
          SELECT format('CREATE DATABASE %I', :'dbname')
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'dbname')\gexec
          SQL
          # Fail closed unless the just-created connector DB is actually reachable.
          docker run --rm --network "$DYNAMICS_DEPLOY_NETWORK" \
            -e PGPASSWORD="$password" postgres:16-alpine \
            psql -h "$host" -p "$port" -U "$user" -d "$db" \
                 -v ON_ERROR_STOP=1 -qtAc 'SELECT current_database()' |
            grep -qx "$db"
          unset password

      - name: Apply Dynamics-only SQL migrations and generate isolated encryption keys
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --env-file "$DYNAMICS_DEPLOY_ENV" \
            -f .dhole-system/deploy/docker-compose.dynamics.yml -p "$DYNAMICS_DEPLOY_PROJECT")
          "${compose[@]}" run --rm --no-deps dynamics-migrate
          "${compose[@]}" run --rm --no-deps dynamics-key-init
          "${compose[@]}" up -d --no-deps --force-recreate --pull never dynamics-api dynamics-worker

      - name: Verify Dynamics readiness BEFORE changing shared API Gateway
        shell: bash
        run: |
          set -euo pipefail
          for try in $(seq 1 30); do
            if docker run --rm --network "$DYNAMICS_DEPLOY_NETWORK" --pull=missing \
              curlimages/curl:8.15.0 -fsS --max-time 5 \
              http://dynamics-api:8080/health/ready >/dev/null 2>&1; then break; fi
            sleep 3
          done
          docker run --rm --network "$DYNAMICS_DEPLOY_NETWORK" --pull=missing \
            curlimages/curl:8.15.0 -fsS --max-time 8 \
            http://dynamics-api:8080/health/ready >/dev/null

      - name: Recreate gateway ONLY after Dynamics ready
        shell: bash
        env:
          TARGET: ${{ github.event_name == 'push' && (github.ref_name == 'master' && 'production' || 'staging') || inputs.target }}
        run: |
          set -euo pipefail
          files=(-f .dhole-system/deploy/docker-compose.services.yml)
          if [[ "$TARGET" == staging ]]; then
            files+=(-f .dhole-system/deploy/docker-compose.staging.yml)
          fi
          docker compose --env-file "$DYNAMICS_DEPLOY_ENV" "${files[@]}" \
            -p "$DYNAMICS_DHOLE_PROJECT" config -q
          docker compose --env-file "$DYNAMICS_DEPLOY_ENV" "${files[@]}" \
            -p "$DYNAMICS_DHOLE_PROJECT" up -d --no-deps --force-recreate --pull never api-gateway
          # Docker reports 'Started' before Kestrel binds to 8080. Wait for a
          # successful readiness probe rather than failing on a transient curl 7.
          health=""
          for attempt in $(seq 1 30); do
            health="$(docker run --rm --network "$DYNAMICS_DEPLOY_NETWORK" --pull=missing \
              curlimages/curl:8.15.0 -s -o /dev/null -w '%{http_code}' --max-time 5 \
              http://api-gateway:8080/api/health/dynamics-connector)" || true
            [[ "$health" == 200 ]] && break
            sleep 2
          done
          [[ "$health" == 200 ]] || { echo "Dynamics gateway failed readiness (HTTP $health)" >&2; exit 1; }
          admin="$(docker run --rm --network "$DYNAMICS_DEPLOY_NETWORK" --pull=missing \
            curlimages/curl:8.15.0 -s -o /dev/null -w '%{http_code}' --max-time 8 \
            http://api-gateway:8080/api/dynamics-admin/connections)"
          [[ "$admin" == 401 ]] || { echo "Anonymous administration was not denied: HTTP $admin" >&2; exit 1; }
          machine="$(docker run --rm --network "$DYNAMICS_DEPLOY_NETWORK" --pull=missing \
            curlimages/curl:8.15.0 -s -o /dev/null -w '%{http_code}' --max-time 8 \
            http://api-gateway:8080/api/dynamics-connector/quotes/00000000-0000-0000-0000-000000000001)"
          [[ "$machine" == 401 ]] || { echo "Anonymous M2M was not denied: HTTP $machine" >&2; exit 1; }
          echo "Dhole Gateway Dynamics routing and anonymous access protections validated."
